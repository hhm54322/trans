server {
    listen 80;
    server_name metatrans.aicarb.com;

    access_log /www/sites/metatrans.aicarb.com/log/access.log main;
    error_log /www/sites/metatrans.aicarb.com/log/error.log;

    client_max_body_size 201m;

    location ^~ /.well-known/acme-challenge {
        allow all;
        root /www/sites/metatrans.aicarb.com/index;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name metatrans.aicarb.com;

    access_log /www/sites/metatrans.aicarb.com/log/access.log main;
    error_log /www/sites/metatrans.aicarb.com/log/error.log;

    client_max_body_size 201m;

    ssl_certificate /www/sites/metatrans.aicarb.com/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/metatrans.aicarb.com/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    http2 on;
    error_page 497 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }
}
